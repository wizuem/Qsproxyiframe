<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Proxy</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe src="https://cors-anywhere.herokuapp.com/https://quantum-services-theta.vercel.app"></iframe>
    <script>
        // This automatically adds the required CORS header
        fetch('https://cors-anywhere.herokuapp.com/')
            .then(response => {
                if (!response.ok) {
                    throw new Error('CORS proxy unavailable');
                }
            })
            .catch(() => {
                document.querySelector('iframe').src =
                    'https://cors-anywhere.herokuapp.com/' + document.querySelector('iframe').src.split('/').pop();
            });
    </script>
</body>
</html>
